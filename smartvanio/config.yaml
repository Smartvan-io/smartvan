# SmartVan.io Setup App
name: "SmartVan.io"
version: "4.0.0"
slug: "smartvanio"
description: >-
  One-click setup + calibration UI for SmartVan.io campervan control system.
  Installs the integration, sensor cards, configures MQTT, and serves a
  device calibration UI via the sidebar.
url: "https://smartvan.io"

arch:
  - aarch64
  - amd64

build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.21"
  amd64: "ghcr.io/home-assistant/amd64-base:3.21"

init: false
startup: services
boot: auto

ingress: true
ingress_port: 8099
panel_icon: "mdi:van-utility"
panel_title: "SmartVan.io"
panel_admin: true

# Needs config directory to install integration + cards + dashboards.
# /data is automatically mapped (persistent state for marker file + cache).
map:
  - config:rw

options:
  mqtt_user: "smartvanio"
  mqtt_password: "smartvanio123"
  force_reprovision: false

schema:
  mqtt_user: str
  mqtt_password: password
  force_reprovision: bool

hassio_api: true
hassio_role: admin
homeassistant_api: true
