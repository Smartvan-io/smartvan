{% extends "base.html" %}

{% block content %}
<section class="card">
    <header class="card-header">
        <h1>Devices</h1>
        <span class="muted">
            {% if ha_ready %}
                <span class="dot dot-ok" title="HA WebSocket connected"></span> connected
            {% else %}
                <span class="dot dot-warn" title="Connecting to HA"></span> connecting…
            {% endif %}
        </span>
    </header>

    <div id="device-list" data-ws="/ws/devices">
        {% include "partials/device_list.html" %}
    </div>
</section>
{% endblock %}
