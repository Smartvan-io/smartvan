{% extends "base.html" %}

{% block title %}{{ device.name }} — SmartVan.io{% endblock %}

{% block content %}
<header class="modal-header">
    <div>
        <div class="modal-title">{{ device.name }}</div>
        <div class="modal-subtitle">
            <span class="badge">{{ device.model }}</span>
            {% if device.sw_version %}<span>fw {{ device.sw_version }}</span>{% endif %}
            <span>{{ device.device_id }}</span>
        </div>
    </div>
    <a href="{{ url_for('pages.index') }}" class="modal-close" aria-label="Back to devices">←</a>
</header>

<div class="modal-body">
    {% block device_body %}{% endblock %}
</div>
{% endblock %}
